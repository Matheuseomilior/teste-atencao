<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teste de Atenção</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      text-align: center;
      padding: 40px;
      background-color: #e6f2ff;
    }

    canvas {
      border: 2px solid #444;
      cursor: crosshair;
      margin-top: 20px;
      display: block;
      margin-left: auto;
      margin-right: auto;
      max-width: 100%;
      height: auto;
      touch-action: none;
    }

    #timer {
      font-size: 24px;
      margin: 20px 0;
      color: black;
    }

    button {
      margin-top: 20px;
      padding: 12px 24px;
      font-size: 18px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      background-color: #007bff;
      color: white;
    }

    #downloadBtn,
    #btnAvancar,
    #btnPronto {
      display: none;
    }

    #telaInicial,
    #paginaFinal,
    #instrucoesEtapa {
      max-width: 700px;
      margin: auto;
      font-size: 18px;
      padding: 20px;
      background-color: white;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>

<body>
  <!-- Tela inicial -->
  <div id="telaInicial">
    <h1>Teste de Atenção</h1>
    <p>Este teste será dividido em 3 etapas, cada uma focando em um tipo diferente de atenção.</p>
    <button id="btnComecar">Começar</button>
  </div>

  <!-- Instruções -->
  <div id="instrucoesEtapa" style="display:none;">
    <h2 id="tituloInstrucao"></h2>
    <p id="textoInstrucao"></p>
    <button id="btnPronto">Pronto</button>
  </div>

  <!-- Conteúdo principal -->
  <div id="conteudoTeste" style="display:none;">
    <h2 id="tituloEtapa">Etapa</h2>
    <div id="timer">Tempo restante</div>
    <canvas id="canvas"></canvas>
